version: 2

project_name: shelf

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/shelf
    # -trimpath drops build paths and -buildvcs=false drops VCS stamping, which keeps builds
    # reproducible and shaves a few kilobytes.
    flags:
      - -trimpath
      - -buildvcs=false
    # main.go declares `version`; release builds override it here.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    goos:
      - linux
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE

aurs:
  - name: shelf-sh-bin
    homepage: https://github.com/rubiin/shelf
    description: Fast, configurable shell plugin manager written in Go.
    license: GPL-3.0-only
    maintainers:
      - "rubiin <roobin.bhandari@gmail.com>"
    git_url: ssh://aur@aur.archlinux.org/shelf-sh-bin.git
    private_key: "{{ .Env.AUR_KEY }}"
    provides:
      - shelf-sh-bin
    conflicts:
      - shelf-sh-bin
    package: |-
      # bin
      install -Dm755 "./shelf" "${pkgdir}/usr/bin/shelf"
      # license
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/shelf/LICENSE"
      # disable self-update: the package manager owns this install
      install -Dm644 "/dev/null" "${pkgdir}/usr/lib/shelf/.disable-self-update"
      # completions (generated at package time from the shipped binary)
      ./shelf completion bash > shelf.bash
      ./shelf completion zsh > _shelf
      ./shelf completion fish > shelf.fish
      install -Dm644 "shelf.bash" "${pkgdir}/usr/share/bash-completion/completions/shelf"
      install -Dm644 "_shelf" "${pkgdir}/usr/share/zsh/site-functions/_shelf"
      install -Dm644 "shelf.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/shelf.fish"


nfpms:
  - package_name: shelf
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/rubiin/shelf
    description: Fast, configurable shell plugin manager written in Go.
    license: GPL-3.0-only
    maintainer: "rubiin <roobin.bhandari@gmail.com>"
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/shelf/LICENSE
      # Disable self-update: the package manager owns this install.
      - src: ./packaging/disable-self-update
        dst: /usr/lib/shelf/.disable-self-update

changelog:
  sort: desc
  use: git

  groups:
    - title: 🚀 New Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?(fix|bug)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999


release:
  # Publish the installer as a release asset, so the stable one-liner URL is
  # https://github.com/rubiin/shelf/releases/latest/download/install.sh
  extra_files:
    - glob: install.sh
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
